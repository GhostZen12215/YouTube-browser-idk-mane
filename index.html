<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Browser</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.search-container{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:60%;
    max-width:500px;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

#playerContainer{
    max-width:1000px;
    margin:0 auto 25px auto;
}

#results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.video-card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.thumbnail{
    width:100%;
    cursor:pointer;
}

.video-info{
    padding:12px;
}

.video-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:8px;
}

.channel{
    color:#666;
    margin-bottom:10px;
}

.watch-btn{
    width:100%;
    border:none;
    background:#cc0000;
    color:white;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.watch-btn:hover{
    opacity:.9;
}

.loading{
    text-align:center;
    font-size:18px;
    margin-top:20px;
}
</style>
</head>
<body>

<h1>YouTube Browser</h1>

<div class="search-container">
    <input
        id="query"
        type="text"
        placeholder="Search YouTube..."
        onkeydown="if(event.key==='Enter') searchVideos();"
    >
    <button onclick="searchVideos()">Search</button>
</div>

<div id="playerContainer"></div>

<div id="status"></div>
<div id="results"></div>

<script>

const API_KEY = "AIzaSyByjWVbBuoR2ocPK8b6E6OA9Ru6GCx13us";

function escapeHtml(text){
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function loadVideo(videoId){

    document.getElementById("playerContainer").innerHTML = `
        <div style="left:0;width:100%;height:0;position:relative;padding-bottom:56.25%;">
            <iframe
                src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
                style="top:0;left:0;width:100%;height:100%;position:absolute;border:0;"
                allowfullscreen
                scrolling="no"
                allow="accelerometer *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;"
                referrerpolicy="strict-origin">
            </iframe>
        </div>
    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

async function searchVideos(){

    const query = document.getElementById("query").value.trim();

    if(!query) return;

    document.getElementById("status").innerHTML =
        '<div class="loading">Searching...</div>';

    document.getElementById("results").innerHTML = "";

    try{

        const response = await fetch(
            `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=24&q=${encodeURIComponent(query)}&key=${API_KEY}`
        );

        const data = await response.json();

        document.getElementById("status").innerHTML = "";

        if(!data.items || data.items.length === 0){
            document.getElementById("results").innerHTML =
                "<p>No videos found.</p>";
            return;
        }

        const results = document.getElementById("results");

        data.items.forEach(video => {

            const videoId = video.id.videoId;
            const title = video.snippet.title;
            const channel = video.snippet.channelTitle;

            const thumb =
                video.snippet.thumbnails.high?.url ||
                video.snippet.thumbnails.medium?.url ||
                video.snippet.thumbnails.default.url;

            const card = document.createElement("div");

            card.className = "video-card";

            card.innerHTML = `
                <img
                    class="thumbnail"
                    src="${thumb}"
                    alt=""
                    onclick="loadVideo('${videoId}')"
                >

                <div class="video-info">

                    <div class="video-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="channel">
                        ${escapeHtml(channel)}
                    </div>

                    <button
                        class="watch-btn"
                        onclick="loadVideo('${videoId}')">
                        Watch Here
                    </button>

                </div>
            `;

            results.appendChild(card);
        });

    }catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
            "<p>Error loading videos. Check your API key.</p>";
    }
}

</script>

</body>
</html>
