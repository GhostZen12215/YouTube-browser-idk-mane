<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YouTube Browser V4</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.search-container {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 60%;
    max-width: 500px;
    padding: 10px;
    font-size: 16px;
}

button {
    padding: 10px 15px;
    cursor: pointer;
}

#playerContainer {
    max-width: 1000px;
    margin: 0 auto 25px auto;
}

#results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
}

.video-card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.thumbnail {
    width: 100%;
    cursor: pointer;
    display: block;
}

.video-info {
    padding: 12px;
}

.video-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

.channel {
    color: #0066cc;
    cursor: pointer;
    margin-bottom: 10px;
}

.watch-btn {
    width: 100%;
    border: none;
    background: #cc0000;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
}

.loading {
    text-align: center;
    font-size: 18px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>YouTube Browser</h1>

<div class="search-container">
    <input id="query" placeholder="Search YouTube..." />
    <button id="searchBtn">Search</button>
</div>

<div id="playerContainer"></div>
<div id="status"></div>
<div id="results"></div>

<script>
const API_KEY = "AIzaSyByjWVbBuoR2ocPK8b6E6OA9Ru6GCx13us";

// ---------------- DOM ----------------
const els = {
    query: document.getElementById("query"),
    searchBtn: document.getElementById("searchBtn"),
    results: document.getElementById("results"),
    status: document.getElementById("status"),
    player: document.getElementById("playerContainer"),
};

// ---------------- INIT ----------------
els.searchBtn.addEventListener("click", searchVideos);
els.query.addEventListener("keydown", e => {
    if (e.key === "Enter") searchVideos();
});

// ---------------- UTIL ----------------
function escapeHtml(text = "") {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function setStatus(msg) {
    els.status.innerHTML = msg;
}

function clearResults() {
    els.results.innerHTML = "";
}

function clearPlayer() {
    els.player.innerHTML = "";
}

// ---------------- PLAYER (YOUR ORIGINAL STYLE) ----------------
function loadVideo(videoId) {
    if (!videoId) return;

    els.player.innerHTML = `
<div style="left: 0; width: 100%; height: 0; position: relative; padding-bottom: 56.25%;">
    <iframe
        src="https://www.youtube.com/embed/${videoId}?rel=0&autoplay=1"
        style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;"
        allowfullscreen
        scrolling="no"
        allow="accelerometer *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;"
        referrerpolicy="strict-origin">
    </iframe>
</div>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---------------- CARD ----------------
function createCard(video, onChannelClick, onVideoClick) {
    const videoId = video?.id?.videoId;
    if (!videoId) return null;

    const s = video.snippet || {};
    const title = s.title || "Untitled";
    const channel = s.channelTitle || "Unknown";
    const channelId = s.channelId || "";

    const thumb =
        s.thumbnails?.high?.url ||
        s.thumbnails?.medium?.url ||
        s.thumbnails?.default?.url ||
        "";

    const card = document.createElement("div");
    card.className = "video-card";

    const img = document.createElement("img");
    img.className = "thumbnail";
    img.src = thumb;
    img.alt = title;
    img.addEventListener("click", () => onVideoClick(videoId));

    const info = document.createElement("div");
    info.className = "video-info";

    const titleEl = document.createElement("div");
    titleEl.className = "video-title";
    titleEl.textContent = title;

    const channelEl = document.createElement("div");
    channelEl.className = "channel";
    channelEl.textContent = channel;

    channelEl.addEventListener("click", () => {
        if (channelId) onChannelClick(channelId, channel);
    });

    const btn = document.createElement("button");
    btn.className = "watch-btn";
    btn.textContent = "Watch Here";
    btn.addEventListener("click", () => onVideoClick(videoId));

    info.append(titleEl, channelEl, btn);
    card.append(img, info);

    return card;
}

// ---------------- API ----------------
async function fetchJSON(url) {
    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok) {
        throw new Error(data?.error?.message || "API error");
    }

    return data;
}

// ---------------- SEARCH ----------------
async function searchVideos() {
    const query = els.query.value.trim();
    if (!query) return;

    setStatus('<div class="loading">Searching...</div>');
    clearResults();
    clearPlayer();

    try {
        const url =
            `https://www.googleapis.com/youtube/v3/search` +
            `?part=snippet&type=video&maxResults=24` +
            `&q=${encodeURIComponent(query)}` +
            `&key=${API_KEY}`;

        const data = await fetchJSON(url);

        render(data.items);
        setStatus("");

    } catch (err) {
        console.error(err);
        setStatus("<p>Error loading videos.</p>");
    }
}

// ---------------- CHANNEL ----------------
async function loadChannel(channelId, channelName) {
    setStatus(`<div class="loading">Loading ${escapeHtml(channelName)}...</div>`);
    clearResults();
    clearPlayer();

    try {
        const url =
            `https://www.googleapis.com/youtube/v3/search` +
            `?part=snippet&channelId=${channelId}` +
            `&order=date&type=video&maxResults=24` +
            `&key=${API_KEY}`;

        const data = await fetchJSON(url);

        setStatus(`<h2>${escapeHtml(channelName)}</h2>`);
        render(data.items);

    } catch (err) {
        console.error(err);
        setStatus("<p>Error loading channel.</p>");
    }
}

// ---------------- RENDER ----------------
function render(items = []) {
    clearResults();

    if (!Array.isArray(items) || items.length === 0) {
        els.results.innerHTML = "<p>No videos found.</p>";
        return;
    }

    const frag = document.createDocumentFragment();

    items.forEach(v => {
        const card = createCard(v, loadChannel, loadVideo);
        if (card) frag.appendChild(card);
    });

    els.results.appendChild(frag);
}
</script>

</body>
</html>
