<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YouTube Browser V7</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.search-container {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 60%;
    max-width: 500px;
    padding: 10px;
    font-size: 16px;
}

button {
    padding: 10px 15px;
    cursor: pointer;
}

#playerContainer {
    max-width: 1000px;
    margin: 0 auto 25px auto;
}

#results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
}

.video-card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.thumbnail {
    width: 100%;
    cursor: pointer;
    display: block;
}

.video-info {
    padding: 12px;
}

.video-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

.channel {
    color: #0066cc;
    cursor: pointer;
    margin-bottom: 10px;
}

.watch-btn {
    width: 100%;
    border: none;
    background: #cc0000;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
}

.loading {
    text-align: center;
    font-size: 18px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>YouTube Browser</h1>

<div class="search-container">
    <input id="query" placeholder="Search YouTube..." />
    <button id="searchBtn">Search</button>
</div>

<div id="playerContainer"></div>
<div id="status"></div>
<div id="results"></div>

<script>
const API_KEY = "AIzaSyByjWVbBuoR2ocPK8b6E6OA9Ru6GCx13us";

// ---------------- DOM ----------------
const els = {
    query: document.getElementById("query"),
    searchBtn: document.getElementById("searchBtn"),
    results: document.getElementById("results"),
    status: document.getElementById("status"),
    player: document.getElementById("playerContainer"),
};

// ---------------- STATE ----------------
let nextPageToken = null;
let prevPageToken = null;
let lastQuery = "";
let lastChannelId = "";
let lastChannelName = "";
let lastMode = "search";

// ---------------- INIT ----------------
els.searchBtn.addEventListener("click", () => {
    lastQuery = els.query.value.trim();
    searchVideos();
});

els.query.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        lastQuery = els.query.value.trim();
        searchVideos();
    }
});

// ---------------- UTIL ----------------
function escapeHtml(text = "") {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function setStatus(msg) {
    els.status.innerHTML = msg;
}

function clearResults() {
    els.results.innerHTML = "";
}

function clearPlayer() {
    els.player.innerHTML = "";
}

// ---------------- PLAYER (your style preserved) ----------------
function loadVideo(videoId) {
    if (!videoId) return;

    els.player.innerHTML = `
<div style="left: 0; width: 100%; height: 0; position: relative; padding-bottom: 56.25%;">
    <iframe
        src="https://www.youtube.com/embed/${videoId}?rel=0&autoplay=1"
        style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;"
        allowfullscreen
        scrolling="no"
        allow="accelerometer *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;"
        referrerpolicy="strict-origin">
    </iframe>
</div>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---------------- API ----------------
async function fetchJSON(url) {
    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok) {
        throw new Error(data?.error?.message || "API error");
    }

    return data;
}

// ---------------- SEARCH ----------------
async function searchVideos(pageToken = "") {

    lastMode = "search";

    setStatus('<div class="loading">Searching...</div>');
    clearResults();
    clearPlayer();

    try {

        let url =
            `https://www.googleapis.com/youtube/v3/search` +
            `?part=snippet&type=video&maxResults=24` +
            `&q=${encodeURIComponent(lastQuery)}` +
            `&key=${API_KEY}`;

        if (pageToken) url += `&pageToken=${pageToken}`;

        const data = await fetchJSON(url);

        nextPageToken = data.nextPageToken || null;
        prevPageToken = data.prevPageToken || null;

        render(data.items);
        renderPagination();

        setStatus("");

    } catch (err) {
        console.error(err);
        setStatus("<p>Error loading videos.</p>");
    }
}

// ---------------- CHANNEL ----------------
async function loadChannel(channelId, channelName, pageToken = "") {

    lastMode = "channel";
    lastChannelId = channelId;
    lastChannelName = channelName;

    setStatus(`<div class="loading">Loading ${escapeHtml(channelName)}...</div>`);
    clearResults();
    clearPlayer();

    try {

        let url =
            `https://www.googleapis.com/youtube/v3/search` +
            `?part=snippet&channelId=${channelId}` +
            `&order=date&type=video&maxResults=24` +
            `&key=${API_KEY}`;

        if (pageToken) url += `&pageToken=${pageToken}`;

        const data = await fetchJSON(url);

        nextPageToken = data.nextPageToken || null;
        prevPageToken = data.prevPageToken || null;

        setStatus(`<h2>${escapeHtml(channelName)}</h2>`);

        render(data.items);
        renderPagination();

    } catch (err) {
        console.error(err);
        setStatus("<p>Error loading channel.</p>");
    }
}

// ---------------- CARD RENDER ----------------
function createCard(video) {

    const videoId = video?.id?.videoId;
    if (!videoId) return null;

    const s = video.snippet || {};

    const card = document.createElement("div");
    card.className = "video-card";

    const img = document.createElement("img");
    img.className = "thumbnail";
    img.src = s.thumbnails?.high?.url || "";
    img.addEventListener("click", () => loadVideo(videoId));

    const info = document.createElement("div");
    info.className = "video-info";

    const title = document.createElement("div");
    title.className = "video-title";
    title.textContent = s.title || "";

    const channel = document.createElement("div");
    channel.className = "channel";
    channel.textContent = s.channelTitle || "";

    channel.addEventListener("click", () => {
        loadChannel(s.channelId, s.channelTitle);
    });

    const btn = document.createElement("button");
    btn.className = "watch-btn";
    btn.textContent = "Watch Here";
    btn.addEventListener("click", () => loadVideo(videoId));

    info.append(title, channel, btn);
    card.append(img, info);

    return card;
}

// ---------------- RENDER ----------------
function render(items = []) {

    clearResults();

    if (!Array.isArray(items) || items.length === 0) {
        els.results.innerHTML = "<p>No videos found.</p>";
        return;
    }

    const frag = document.createDocumentFragment();

    items.forEach(v => {
        const card = createCard(v);
        if (card) frag.appendChild(card);
    });

    els.results.appendChild(frag);
}

// ---------------- PAGINATION ----------------
function renderPagination() {

    const div = document.createElement("div");
    div.style.textAlign = "center";
    div.style.marginTop = "20px";

    if (prevPageToken) {
        const prev = document.createElement("button");
        prev.textContent = "⬅ Prev";

        prev.onclick = () => {
            if (lastMode === "search") {
                searchVideos(prevPageToken);
            } else {
                loadChannel(lastChannelId, lastChannelName, prevPageToken);
            }
        };

        div.appendChild(prev);
    }

    if (nextPageToken) {
        const next = document.createElement("button");
        next.textContent = "Next ➡";
        next.style.marginLeft = "10px";

        next.onclick = () => {
            if (lastMode === "search") {
                searchVideos(nextPageToken);
            } else {
                loadChannel(lastChannelId, lastChannelName, nextPageToken);
            }
        };

        div.appendChild(next);
    }

    els.results.appendChild(div);
}
</script>

</body>
</html>
